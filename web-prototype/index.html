<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Smash.fun" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#090807" />
    <title>Smash.fun</title>
    <meta name="description" content="A fan-made browser port of Super Smash Bros. for the Nintendo 64. Create custom fighters and play them inside the original game." />
    <!-- Link unfurls (Discord, Twitter, iMessage, Slack). The image is a
         roster card exported from /og-studio; bump ?v= when it changes so
         crawlers refetch it. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Smash.fun" />
    <meta property="og:url" content="https://smash.fun/" />
    <meta property="og:title" content="Smash.fun" />
    <meta property="og:description" content="Super Smash Bros. 64 in your browser, with 1,000+ new fighters. Create your own and play them inside the original game." />
    <meta property="og:image" content="https://smash.fun/og-image.png?v=1" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A crowd of Smash.fun fighters in front of the Smash.fun logo" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Smash.fun" />
    <meta name="twitter:description" content="Super Smash Bros. 64 in your browser, with 1,000+ new fighters. Create your own and play them inside the original game." />
    <meta name="twitter:image" content="https://smash.fun/og-image.png?v=1" />
    <link rel="icon" href="/favicon.ico?v=7" sizes="16x16 32x32 48x48" />
    <link rel="icon" href="/favicon-16.png?v=7" type="image/png" sizes="16x16" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=7" />
    <link rel="preload" href="/src/fonts/smash-caption-regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/src/fonts/smash-caption-condensed.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/src/fonts/smash-caption-narrow.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Kanit:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
