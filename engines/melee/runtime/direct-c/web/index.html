<!doctype html><meta charset="utf-8"><title>OpenSmash direct-C validation</title>
<style>body{margin:0;background:#111820;color:#eee;font:15px system-ui}header{padding:16px;display:flex;gap:12px;align-items:center}canvas{width:min(100vw,960px);aspect-ratio:4/3;display:block;margin:auto;background:#000}pre{white-space:pre-wrap;max-height:220px;overflow:auto;padding:16px}button,input{font:inherit}</style>
<header><strong>OpenSmash · direct C</strong><input id="disc" type="file" accept=".iso,.gcm"><button id="start">Start</button><output id="status">Choose your Melee USA 1.02 disc</output></header>
<canvas id="canvas" width="960" height="720"></canvas><pre id="log"></pre>
<script type="module">
import {createDirectAudioNode} from "/engine/direct-c/audio-output.mjs";
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('bitmaprenderer'),log=document.querySelector('#log'),status=document.querySelector('#status');
const verifiedDiscs=new WeakSet();let worker,audioContext;const keys=new Set();const mapping={KeyJ:256,KeyK:512,Space:1024,KeyL:2048,KeyU:16,KeyI:64,KeyO:32,Enter:4096};
window.addEventListener('keydown',e=>{keys.add(e.code);if(mapping[e.code]||['KeyW','KeyA','KeyS','KeyD'].includes(e.code))e.preventDefault()});window.addEventListener('keyup',e=>keys.delete(e.code));window.addEventListener('blur',()=>keys.clear());
setInterval(()=>{if(!worker)return;let b=0;for(const k of keys)b|=mapping[k]||0;worker.postMessage({type:'input',values:[0,b,(keys.has('KeyD')?80:0)-(keys.has('KeyA')?80:0),(keys.has('KeyW')?80:0)-(keys.has('KeyS')?80:0),0,0,keys.has('KeyI')?140:0,keys.has('KeyO')?140:0,1]})},8);
document.querySelector('#start').onclick=async()=>{const iso=document.querySelector('#disc').files[0];if(!iso)return;worker?.terminate();if(audioContext)void audioContext.close();const audio=window.directArgs?.includes('--no-audio')?null:new SharedArrayBuffer(16+32768*2*4);if(audio){const ac=audioContext=new AudioContext({sampleRate:48000});void ac.resume();void Promise.race([ac.audioWorklet.addModule('/engine/direct-c/audio-worklet.mjs').then(()=>true,()=>false),new Promise(resolve=>setTimeout(()=>resolve(false),1000))]).then(async ready=>{const node=await createDirectAudioNode(ac,audio,ready);if(ac===audioContext)node.connect(ac.destination);});}window.directEvents=[];worker=window.directWorker=new Worker('./worker.mjs',{type:'module'});worker.onerror=e=>{window.directEvents.push({type:'error',message:e.message});status.textContent=e.message;};window.directRenderedFrames=0;worker.onmessage=({data})=>{if(data.bitmap){window.directRenderedFrames=(window.directRenderedFrames||0)+1;ctx.transferFromImageBitmap(data.bitmap);return;}data.receivedAtMs=performance.now();data.presentedFrames=window.directRenderedFrames||0;window.directEvents.push(data);if(data.type==='disc-verified')verifiedDiscs.add(iso);if(data.type==='log'){log.textContent=(log.textContent+data.message+'\n').slice(-16000);}if(data.type==='progress')status.textContent=`Frame ${data.frame} · ${data.fps.toFixed(1)} FPS`;if(data.type==='error')status.textContent=data.message;};const costumes=[],cssAssets=[],fixture=window.directFixture||new URLSearchParams(location.search).get('fixture');if(fixture){const root='/build/direct-c/'+fixture+'-fixture/';const manifest=fixture==='compact'?['PlMrNr.dat']:await (await fetch(root+'manifest.json')).json();for(const filename of manifest){const response=await fetch(root+filename);if(!response.ok)throw Error('Missing local fixture '+filename);(filename.startsWith('Pl')?costumes:cssAssets).push({filename,blob:await response.blob()});}}worker.postMessage({type:'start',iso,discVerified:verifiedDiscs.has(iso),audio,costumes,cssAssets,launch:window.directLaunch||[0,31,5,4,8,264,268,770,777],args:['--seed','3',...(window.directArgs||[]),...new URLSearchParams(location.search).has('fast')?['--fast']:[]]});};
</script>
