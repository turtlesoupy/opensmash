# Triggered only by vMAJOR.MINOR.PATCH[-prerelease] tags. No hosted GitHub jobs.
steps:
  - id: stage
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:stable
    entrypoint: bash
    args: ['infra/gcp/python.sh', 'infra/gcp/coordinator.py', 'stage', '--tag', '$TAG_NAME', '--commit', '$COMMIT_SHA', '--build', '$BUILD_ID']
  - id: windows
    waitFor: ['stage']
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:stable
    entrypoint: bash
    args: ['infra/gcp/python.sh', 'infra/gcp/coordinator.py', 'run', '--platform', 'windows-x64', '--build', '$BUILD_ID']
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_MEDIUM
timeout: 7800s
